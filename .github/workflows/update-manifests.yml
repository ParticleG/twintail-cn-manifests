name: Update manifests

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-manifests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Run generator tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

  update:
    name: Refresh manifests from the official API
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The generator appends changed/summary to GITHUB_OUTPUT and writes
      # nothing when any server returns unexpected data.
      - name: Refresh manifests
        id: refresh
        run: python3 scripts/update-manifests.py --apply

      # TwintailLauncher fast-forwards its clone of main, so the push is a
      # normal commit and is never forced. Pushing with GITHUB_TOKEN does not
      # trigger another workflow run.
      - name: Commit refreshed manifests
        if: steps.refresh.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SUMMARY: ${{ steps.refresh.outputs.summary }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ParticleG'
          git config user.email 'particle_g@outlook.com'
          git add -- ./*.json
          git commit -m "Update manifests: ${SUMMARY}"
          gh auth setup-git
          git push origin "HEAD:${GITHUB_REF_NAME}"
